; PC-98 RS-232C settings for IME98.COM / IME98TSR.COM.
; Defaults are np21w's verified non-FIFO COM1 mapping.
DATA_PORT=0030
STATUS_PORT=0032
MODE=02
COMMAND=27
; np21w COM1 receive polling is driven by PIT channel 2. 0008 = 19200 baud.
TIMER_COUNT=0008
; TSR toggle: SHIFT+SPACE, CTRL+SPACE, or GRAPH+SPACE.
HOTKEY=SHIFT+SPACE
